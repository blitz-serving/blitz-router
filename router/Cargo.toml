[package]
name = "router"
version.workspace = true
edition.workspace = true


[lib]
path = "src/lib.rs"

[[bin]]
name = "router"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
async-stream = "0.3.5"
axum = { version = "0.6.20", features = ["json"] }
axum-tracing-opentelemetry = "0.14.1"
clap = { version = "4.4.5", features = ["derive", "env"] }
eventsource-client = { version = "0.15.0" }
futures = "0.3.28"
futures-util = "0.3.31"
metrics = "0.21.1"
metrics-exporter-prometheus = { version = "0.12.1", features = [] }
nohash-hasher = "0.2.0"
opentelemetry = { version = "0.20.0", features = ["rt-tokio"] }
opentelemetry-otlp = "0.13.0"
reqwest = { version = "0.11.20", features = ["stream", "json"] }
serde = "1.0.188"
serde_json = "1.0.107"
thiserror = "1.0.48"
tokenizers = { version = "0.21.4", features = ["http"] }
tokio = { version = "1.32.0", features = [
    "rt",
    "rt-multi-thread",
    "parking_lot",
    "signal",
    "sync",
    "fs",
] }
tokio-stream = "0.1.14"
pb = { path = "../rust-proto" }
grpc-metadata = { path = "../rust-grpc" }
prost = "^0.12"
tonic = "^0.10"
tower = "^0.4"
tracing = "^0.1"
http = "*"
rand = "0.8.5"
sha2 = "0.10"
tower-http = { version = "0.4.4", features = ["cors"] }
tracing-opentelemetry = "0.21.0"
tracing-subscriber = { version = "0.3.17", features = ["json", "env-filter"] }
utoipa = { version = "3.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "3.1.5", features = ["axum"] }
ngrok = { version = "0.13.1", features = ["axum"], optional = true }
hf-hub = "0.3.1"
init-tracing-opentelemetry = { version = "0.14.1", features = [
    "opentelemetry-otlp",
] }
toml = "0.8.12"
tracing-appender = "0.2.3"
async-channel = "2.3.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
smallvec = { version = "1.15.1" }
zeromq = { version = "0.4", optional = true }
rmp-serde = { version = "1.3", optional = true }
pyo3 = { version = "0.23", features = ["auto-initialize", "py-clone"], optional = true }

[dev-dependencies]
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "radix_bench"
harness = false

[build-dependencies]
vergen = { version = "8.2.5", features = ["build", "git", "gitcl"] }

[features]
default = [
    "ngrok",
    "vllm-backend",
    "radixtree-blockhash",
    "default-hash-algo",
    "determinent-schedule",
]
ngrok = ["dep:ngrok"]
statistic = []

# ------ Deployment ------ #
colocation = []
vllm-backend = ["colocation"]
zmq-backend = ["dep:zeromq", "dep:rmp-serde", "colocation"]
python-chat-template = ["dep:pyo3"]
# ----------------------- #

# ---- Prefix Cache ----- #
default-hash-algo = []
sha256-hash-algo = []
hashtable-blockhash = []
radixtree-blockhash = []
# ----------------------- #

# --- Scheduling Policy -- #
random-q = []
round-robin-q = []
join-shortest-q = []
bounded-most-hit-q = []
least-wait-token-q = []
bailian-impl-q = []
aibrix-q = []
dynamo-q = []
dynamo-decoupled-q = []
lmetric-q = []
preble-q = []
# Legacy aliases (prefer system-specific names above)
join-shortest-q-tuple = []
join-shortest-q-weight = []

stochastic-schedule = []
determinent-schedule = []
# ----------------------- #
