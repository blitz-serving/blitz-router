\* Liveness checking configuration
\* Uses LiveSpec (with fairness) + step bound large enough for full resolution
\* 2 requests × ~6 steps max per lifecycle = 12 steps sufficient

CONSTANTS
    RequestIds = {1, 2}
    MaxSteps   = 12
    CHANNEL_CAP = 2

CONSTRAINT StepBound

SPECIFICATION LiveSpec

\* Safety invariants
INVARIANT OwnershipUniqueness
INVARIANT PhaseConsistency
INVARIANT PhaseCompleteness
INVARIANT ExceptionStateValidity
INVARIANT NoResurrection
INVARIANT EngineContainment
INVARIANT MetricNonNegative

\* Liveness properties
PROPERTY RequestTermination
PROPERTY ExceptionResolution
PROPERTY ChannelDrain
