[runtime.raw]
config = [
    { app = "vllm1", background = true },
    { app = "vllm2", background = true },
    { app = "vllm3", background = true },
    { app = "vllm4", background = true },
    { app = "vllm5", background = true },
    { app = "vllm6", background = true },
    { app = "vllm7", background = true },
    { app = "vllm8", background = true },

    { app = "blitz_scale", background = true },

    { app = "azure_client", background = false }
]

# ===== vLLM 实例 =====
[app.vllm1]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50180"
]
envs = { CUDA_VISIBLE_DEVICES = "0", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm2]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50181"
]
envs = { CUDA_VISIBLE_DEVICES = "1", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm3]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50182"
]
envs = { CUDA_VISIBLE_DEVICES = "2", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm4]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50183"
]
envs = { CUDA_VISIBLE_DEVICES = "3", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm5]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50184"
]
envs = { CUDA_VISIBLE_DEVICES = "4", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm6]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50185"
]
envs = { CUDA_VISIBLE_DEVICES = "5", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm7]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50186"
]
envs = { CUDA_VISIBLE_DEVICES = "6", TORCH_CUDA_ARCH_LIST = "8.0" }

[app.vllm8]
executable = ["bash", "-c"]
extra_args = [
    "source ~/myenv/bin/activate && vllm serve /data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/ --no-enable-prefix-caching --max-num-seqs 4096 --port 50187"
]
envs = { CUDA_VISIBLE_DEVICES = "7", TORCH_CUDA_ARCH_LIST = "8.0" }

# ===== blitz-scale =====
[app.blitz_scale]
executable = ["blitz-scale"]
extra_args = []
envs = {}

# ===== client (azure trace, factor=1) =====
[app.azure_client]
executable = ["cargo", "run", "--release", "--"]
extra_args = []
envs = {}

macro_rules = {
    "--tokenizer" = "config.tokenizer",
    "--endpoint" = "config.endpoint",
    "--protocol" = "config.protocol",
    "--dataset-type" = "config.dataset_type",
    "--dataset-path" = "config.dataset_path",
    "--replay-mode" = "config.replay_mode",
    "--scale-factor" = "config.scale_factor",
    "--time-in-secs" = "config.time_in_secs",
    "--output-path" = "config.output_path"
}

[app.azure_client.config]
tokenizer = "./tokenizer.json"
endpoint = "http://localhost:50180/generate"
protocol = "azure"
dataset_type = "azure"
dataset_path = "./data/azure.csv"
replay_mode = true
scale_factor = 1.0
time_in_secs = 60
output_path = "./log/output.jsonl"
