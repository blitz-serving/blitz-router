# ========== 1. 启动 8 个 vLLM 实例 ==========
[runtime.raw]
config = [
    # vllm 实例 1
    # { app = "vllm5", envs = { CUDA_VISIBLE_DEVICES = "4", TORCH_CUDA_ARCH_LIST = "8.0" }, background = true },
    # { app = "vllm6", envs = { CUDA_VISIBLE_DEVICES = "5", TORCH_CUDA_ARCH_LIST = "8.0" }, background = true },
    # { app = "vllm7", envs = { CUDA_VISIBLE_DEVICES = "6", TORCH_CUDA_ARCH_LIST = "8.0" }, background = true },
    # { app = "vllm8", envs = { CUDA_VISIBLE_DEVICES = "7", TORCH_CUDA_ARCH_LIST = "8.0" }, background = true, block_keyword = "Available route" },
    { app = "router", envs = { RUST_BACKTRACE = "full", LOG_LEVEL = "info" }, background = true, block_keyword = "ready" },
    { app = "client1", background = true },
    { app = "client2"},
]
[app.vllm1]
executable = ["/data/zkx/vllm_env_origin/myenv/bin/vllm", "serve"]
extra_args = [
    "/data/huggingface/hub/models--LLM-Research--Meta-Llama-3.1-8B-Instruct/",
    "--no-enable-prefix-caching",
    "--max-num-batched-tokens",
    "1024",
    "--port",
    "50180",
]


