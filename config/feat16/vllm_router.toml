# ========== 启动配置 ==========
[runtime.raw]
config = [
    { app = "router", envs = { RUST_BACKTRACE = "full", LOG_LEVEL = "info" }, background = false },
]

# ======= Shared variables ========
# can be ingested from outside to avoid hard coding
# NOTE: RHS can only expand parameters defined outside ${var-name}
[variables]
model_path = "${model-path}"
blitzdir = "${work-dir}"
tokenizer_path = "${model-path}/tokenizer.json"
vllm_executable = "${venv-path}/bin/vllm serve"
client_executable = "${work-dir}/target/release/client"
base_vllm_port = 59180
dataset_dir = "/nvme/lmetric/datasets"
log_dir = "${log-dir}"
output_dir = "${output-dir}"

# ========== 路由器配置（不变）==========
[app.router]
executable = ["${blitzdir}/target/release/router_v2"]
extra_args = ["--use-tokenizer"]

[app.router.macro_rules]
"--hostname" = "hostname"
"--port" = "port"
"--deployment" = "deploy"
"--tokenizer-name" = "tokenizer"
"--model-name" = "model"
"--model-path" = "model_path"
"--parameter-size" = "param_size"
"--client-config" = "cli_stub_cfg"
"--deployment-config-path" = "deploy_cfg"
"--log-path" = "log_path"
"--max-input-length" = "context_length"
"--max-total-tokens" = "total_tokens"
"--max-concurrent-requests" = "concurrent_req"
"--tokens-prefilled-per-sec" = "prefill_thpt"
"--tokens-transferred-per-sec" = "network_thpt"
"--max-blocks-per-replica" = "block_num"
"--max-prefill-num" = "max_prefill"
"--max-decode-num" = "max_decode"
"--min-prefill-num" = "min_prefill"
"--min-decode-num" = "min_decode"
"--prefill-lower-bound" = "prefill_scale_down_threshold"
"--prefill-upper-bound" = "prefill_scale_out_threshold"
"--decode-lower-bound" = "decode_scale_down_threshold"
"--decode-upper-bound" = "decode_scale_up_threshold"
"--migration-lower-bound" = "migrate_scale_down_threshold"
"--migration-upper-bound" = "migrate_scale_up_threshold"
"--scale-down-threshold-millis" = "time_to_leave"
"--num-hidden-layers" = "model_layers"
"--num-gpus-per-node" = "gpu_num_per_node"
"--mock-load-millis" = "mock_load_time"
"--mock-transfer-millis" = "mock_transfer_time"
"--tensor-parallel-size" = "tp_size"
"--max-batch-prefill-tokens" = "mbpt"

[app.router.config]
hostname = "localhost"
port = "58009"
deploy = "colocation"
model = "${model_path}"
model_path = "${model_path}"
tokenizer = "${model_path}"
param_size = 16
cli_stub_cfg = "${blitzdir}/exps/blitz-run/configs/config-stubs4567.json"
deploy_cfg = "${blitzdir}/exps/blitz-run/configs/config-router4567.json"
log_path = "${output_dir}/router_v2.log"
context_length = 15999
total_tokens = 16000
concurrent_req = 4096
prefill_thpt = 13000
network_thpt = 30000
block_num = 8000
max_prefill = 7
max_decode = 7
min_prefill = 1
min_decode = 1
prefill_scale_down_threshold = 0.3
prefill_scale_out_threshold = 0.6
decode_scale_down_threshold = 0.66
decode_scale_up_threshold = 0.9
migrate_scale_down_threshold = 0.2
migrate_scale_up_threshold = 0.4
time_to_leave = 1000
model_layers = 32
gpu_num_per_node = 8
mock_load_time = 0
mock_transfer_time = 0
tp_size = 1
mbpt = 19999
