\* TLC model checking configuration for CompletionLoop.tla
\*
\* Small model: 3 requests, 5 steps, channel cap 2
\* Explores ~10^6 states in seconds.
\* Increase RequestIds / MaxSteps for deeper coverage.

CONSTANTS
    RequestIds = {1, 2, 3}
    MaxSteps   = 5
    CHANNEL_CAP = 2

INIT Init

NEXT Next

\* Bound step_count for safety checking (prevents infinite state space)
CONSTRAINT StepBound

\* --- Safety invariants (checked in every reachable state) ---
INVARIANT OwnershipUniqueness
INVARIANT PhaseConsistency
INVARIANT PhaseCompleteness
INVARIANT ExceptionStateValidity
INVARIANT NoResurrection
INVARIANT EngineContainment
INVARIANT MetricNonNegative

\* --- Liveness properties (require fairness, checked under LiveSpec) ---
\* Uncomment to check liveness (slower, uses LiveSpec instead of Spec):
\* PROPERTY RequestTermination
\* PROPERTY ExceptionResolution
\* PROPERTY ChannelDrain
