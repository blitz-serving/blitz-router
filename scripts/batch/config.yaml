cuda_devices: [0,1,2,3,4,5,6,7]

dataset_home: "./dataset_home"

inter_node_server:
  enabled: true 
  config:
    g0001: "10.254.0.10"
    g0002: "10.254.0.09"

default_settings:
  # set min prefill number and min decode number
  init_prefill_num: 1
  init_decode_num: 1
  max_prefill_num: 7
  max_decode_num: 7
  min_prefill_num: 1
  min_decode_num: 1
  prefill_lower_bound: 0.3
  prefill_upper_bound: 0.6
  decode_lower_bound: 0.66
  decode_upper_bound: 0.90
  migration_lower_bound: 0.2
  migration_upper_bound: 0.4
  scale_down_threshold_millis: 1500
  scale_factor: 0.6
  num_gpus_per_node: 4
  client_request_time_in_secs: 30

model_configs:
  llama2_7b:
    tensor_parallel_size: 1
    init_status: ["Prefill", "Decode"] # init status, if prefill/decode number < min prefill/decode, will add some active instances
    traces:
      Full:
        # - "AzureCode-moti-pick-1"
        # - "AzureCode-pick-11"
        - "AzureCode2023-2min"
      Half: []
  # mistral_24b:
